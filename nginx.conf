# Based on Funkwhale's front/docker/funkwhale.conf.template (2.0.14).
# __PORT__, __MEDIA_ROOT__, __MUSIC_ROOT__, __MAX_BODY__ and __PUBLIC_URL__
# are filled in by the start script.
user nginx;
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    upstream funkwhale-api {
        server 127.0.0.1:5000;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Railway's edge terminates TLS and sends X-Forwarded-Proto
    map $http_x_forwarded_proto $fw_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen __PORT__;
        listen [::]:__PORT__;
        server_name _;

        root /frontend;
        client_max_body_size __MAX_BODY__;
        charset utf-8;

        gzip on;
        gzip_comp_level 5;
        gzip_min_length 256;
        gzip_proxied any;
        gzip_vary on;
        gzip_types application/javascript application/json image/svg+xml text/css text/plain;

        add_header Content-Security-Policy "default-src 'self'; connect-src https: wss: http: ws: 'self' 'unsafe-eval'; script-src 'self' 'wasm-unsafe-eval'; style-src https: http: 'self' 'unsafe-inline'; img-src https: http: 'self' data:; font-src https: http: 'self' data:; media-src https: http: 'self' data:; object-src 'none'";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Service-Worker-Allowed "/";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fw_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;

        location /api/ {
            proxy_pass http://funkwhale-api;
        }

        location ~ ^/library/(albums|tracks|artists|playlists)/ {
            proxy_pass http://funkwhale-api;
        }

        location /channels/ {
            proxy_pass http://funkwhale-api;
        }

        location ~ ^/@(vite-plugin-pwa|vite|id)/ {
            alias /frontend/;
            try_files $uri $uri/ /index.html;
        }

        location /@ {
            proxy_pass http://funkwhale-api;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~ "/(front/)?embed.html" {
            alias /frontend/embed.html;
            add_header Content-Security-Policy "connect-src https: http: 'self'; default-src 'self'; script-src 'self' unpkg.com 'unsafe-inline' 'unsafe-eval'; style-src https: http: 'self' 'unsafe-inline'; img-src https: http: 'self' data:; font-src https: http: 'self' data:; object-src 'none'; media-src https: http: 'self' data:";
            add_header Referrer-Policy "strict-origin-when-cross-origin";
            expires 1d;
        }

        location /federation/ {
            proxy_pass http://funkwhale-api;
        }

        # Subsonic API (DSub, Ultrasonic, Substreamer and other apps)
        location /rest/ {
            proxy_pass http://funkwhale-api/api/subsonic/rest/;
        }

        location /.well-known/ {
            proxy_pass http://funkwhale-api;
        }

        location /staticfiles/ {
            alias /app/staticfiles/;
            expires 7d;
        }

        location /media/__sized__/ {
            alias __MEDIA_ROOT__/__sized__/;
            add_header Access-Control-Allow-Origin '*';
        }

        location /media/attachments/ {
            alias __MEDIA_ROOT__/attachments/;
            add_header Access-Control-Allow-Origin '*';
        }

        location /media/dynamic_preferences/ {
            alias __MEDIA_ROOT__/dynamic_preferences/;
            add_header Access-Control-Allow-Origin '*';
        }

        # Uploaded audio, served only after the API has checked permissions
        location ~ /_protected/media/(.+) {
            internal;
            alias __MEDIA_ROOT__/$1;
            add_header Access-Control-Allow-Origin '*';
        }

        # In-place imported music, served only after the API has checked permissions
        location /_protected/music/ {
            internal;
            alias __MUSIC_ROOT__/;
            add_header Access-Control-Allow-Origin '*';
        }

        location /manifest.json {
            return 302 __PUBLIC_URL__/api/v2/instance/spa-manifest.json;
        }
    }
}
